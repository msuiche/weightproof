name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build verifier CLI
        run: cargo build --locked --release --bin weightproof --target ${{ matrix.target }}

      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/weightproof" "dist/weightproof-${{ matrix.target }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "weightproof-${{ matrix.target }}" > "weightproof-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "weightproof-${{ matrix.target }}" > "weightproof-${{ matrix.target }}.sha256"
          fi
          tar -czf "weightproof-${{ matrix.target }}.tar.gz" \
            "weightproof-${{ matrix.target }}" \
            "weightproof-${{ matrix.target }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: weightproof-${{ matrix.target }}
          path: dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
